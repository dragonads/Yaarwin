<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Yaarwin Offical</title>
  <meta name="description" content="Yaarwin Offical Telegram Community">

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

  <link
    href="https://fonts.googleapis.com/css2?family=Cinzel:wght@600;700;800;900&family=Inter:wght@400;500;600;700;800;900&display=swap"
    rel="stylesheet"
  >

  <style>
    :root {
      --bg-dark: #0d0d0d;
      --bg-card: rgba(30,30,30,.75);
      --text-main: #fff;
      --text-muted: #a8a8a8;
      --radius-btn: 16px;
      --radius-card: 24px;
    }

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    html,
    body {
      width: 100%;
      height: 100%;
    }

    body {
      min-height: 100svh;
      background:
        radial-gradient(
          circle at 50% 15%,
          rgba(255,255,255,.08),
          transparent 32%
        ),
        radial-gradient(
          circle at 15% 80%,
          rgba(255,255,255,.035),
          transparent 30%
        ),
        var(--bg-dark);

      color: var(--text-main);
      font-family: 'Inter', sans-serif;

      display: flex;
      justify-content: center;
      align-items: center;

      position: relative;
      overflow: hidden;
    }

    /* Ambient Glow */
    .orb {
      position: fixed;
      border-radius: 50%;
      filter: blur(70px);
      pointer-events: none;
      opacity: .15;
    }

    .orb.one {
      width: 180px;
      height: 180px;
      top: -60px;
      left: -50px;
      background: #fff;
    }

    .orb.two {
      width: 220px;
      height: 220px;
      right: -80px;
      bottom: -80px;
      background: #fff;
      opacity: .08;
    }

    /* Stars */
    .stars {
      position: fixed;
      inset: 0;
      pointer-events: none;
      overflow: hidden;
    }

    .star {
      position: absolute;
      width: 2px;
      height: 2px;
      background: rgba(255,255,255,.7);
      border-radius: 50%;
      animation: twinkle 3s infinite ease-in-out;
    }

    @keyframes twinkle {
      0%,100% {
        opacity: .15;
      }

      50% {
        opacity: .8;
      }
    }

    /* Container */
    .container {
      width: 100%;
      max-width: 420px;

      padding: 24px 20px 28px;

      display: flex;
      flex-direction: column;
      align-items: center;

      position: relative;
      z-index: 2;
    }

    /* Live Badge */
    .live-badge {
      display: inline-flex;
      align-items: center;
      gap: 8px;

      padding: 5px 14px;
      margin-bottom: 18px;

      border-radius: 50px;

      background: rgba(255,255,255,.07);
      border: 1px solid rgba(255,255,255,.12);

      color: #fff;

      font-size: .72rem;
      font-weight: 800;

      letter-spacing: .8px;
      text-transform: uppercase;
    }

    .live-dot {
      width: 7px;
      height: 7px;

      border-radius: 50%;
      background: #fff;

      box-shadow: 0 0 10px rgba(255,255,255,.8);

      animation: pulse 1.5s infinite;
    }

    @keyframes pulse {
      0%,100% {
        transform: scale(1);
        opacity: 1;
      }

      50% {
        transform: scale(.65);
        opacity: .5;
      }
    }

    /* Brand */
    .brand {
      width: 100%;
      text-align: center;
      margin-bottom: 24px;
    }

    .logo-img {
      width: 180px;
      height: 180px;

      object-fit: cover;

      border-radius: 50%;

      border: 4px solid rgba(255,255,255,.85);

      box-shadow:
        0 0 20px rgba(255,255,255,.12),
        0 0 50px rgba(255,255,255,.05);

      display: block;
      margin: 0 auto 14px;
    }

    .brand-title {
      font-family: 'Cinzel', serif;

      font-size: clamp(1.25rem, 6vw, 2.4rem);

      font-weight: 900;

      line-height: 1.1;

      white-space: nowrap;

      text-shadow:
        0 0 10px rgba(255,255,255,.12);
    }

    .tagline {
      margin-top: 7px;

      color: var(--text-muted);

      font-size: .82rem;
      font-weight: 500;

      letter-spacing: .3px;
    }

    /* Divider */
    .divider {
      width: 60px;
      height: 3px;

      margin: 0 auto 24px;

      border-radius: 10px;

      background: #fff;

      box-shadow:
        0 0 12px rgba(255,255,255,.35);
    }

    /* Button */
    .buttons {
      width: 100%;

      display: flex;
      flex-direction: column;

      gap: 12px;
    }

    .btn {
      width: 100%;

      display: flex;
      justify-content: center;
      align-items: center;

      padding: 16px 20px;

      border-radius: var(--radius-btn);

      text-decoration: none;

      font-size: 1rem;
      font-weight: 800;

      letter-spacing: .4px;

      transition:
        transform .2s ease,
        box-shadow .2s ease;
    }

    .btn-secondary {
      background: #fff;
      color: #0d0d0d;

      box-shadow:
        0 8px 25px rgba(255,255,255,.08);
    }

    .btn-secondary:hover {
      transform: translateY(-2px);

      box-shadow:
        0 12px 30px rgba(255,255,255,.14);
    }

    .btn-secondary:active {
      transform: scale(.98);
    }

    /* Timer */
    .timer-card {
      width: 100%;

      margin-top: 14px;

      padding: 15px 20px;

      border-radius: var(--radius-card);

      background: var(--bg-card);

      border: 1px solid rgba(255,255,255,.09);

      backdrop-filter: blur(14px);
      -webkit-backdrop-filter: blur(14px);

      text-align: center;

      box-shadow:
        inset 0 1px 0 rgba(255,255,255,.04);
    }

    .timer-label {
      color: var(--text-muted);

      font-size: .72rem;
      font-weight: 700;

      letter-spacing: .7px;

      text-transform: uppercase;

      margin-bottom: 5px;
    }

    .timer-display {
      font-family: 'Cinzel', serif;

      font-size: 2rem;
      font-weight: 900;

      line-height: 1;

      letter-spacing: 2px;
    }

    .timer-note {
      color: #777;

      font-size: .62rem;

      margin-top: 7px;
    }

    /* Stats */
    .stats {
      width: 100%;

      display: flex;
      justify-content: center;
      align-items: center;

      gap: 18px;

      margin-top: 24px;
    }

    .stat {
      flex: 1;
      text-align: center;
    }

    .stat-number {
      font-size: .95rem;
      font-weight: 900;
      line-height: 1.2;
    }

    .stat-label {
      color: #777;

      font-size: .58rem;
      font-weight: 700;

      letter-spacing: .5px;

      margin-top: 3px;
    }

    /* Footer */
    .footer {
      margin-top: 24px;

      text-align: center;

      color: #555;

      font-size: .62rem;
    }

    .footer span {
      color: #888;
      font-weight: 700;
    }

    /* Small Height */
    @media (max-height: 700px) {

      .container {
        padding-top: 12px;
        padding-bottom: 12px;
      }

      .live-badge {
        margin-bottom: 10px;
      }

      .logo-img {
        width: 135px;
        height: 135px;
        margin-bottom: 10px;
      }

      .brand {
        margin-bottom: 16px;
      }

      .divider {
        margin-bottom: 16px;
      }

      .timer-card {
        margin-top: 10px;
        padding: 12px 18px;
      }

      .stats {
        margin-top: 16px;
      }

      .footer {
        margin-top: 14px;
      }
    }

    /* Small Width */
    @media (max-width: 360px) {

      .container {
        padding-left: 16px;
        padding-right: 16px;
      }

      .logo-img {
        width: 150px;
        height: 150px;
      }

      .brand-title {
        font-size: 1.25rem;
      }

      .btn {
        padding: 14px 18px;
        font-size: .92rem;
      }

      .timer-display {
        font-size: 1.7rem;
      }
    }
  </style>
</head>

<body>

  <div class="orb one"></div>
  <div class="orb two"></div>

  <div class="stars" id="stars"></div>

  <main class="container">

    <!-- Live -->
    <div class="live-badge">
      <span class="live-dot"></span>
      LIVE NOW
    </div>

    <!-- Brand -->
    <div class="brand">

      <img
        src="images.jpeg"
        alt="Yaarwin Offical"
        class="logo-img"
      >

      <h1 class="brand-title">
        𝐘𝐚𝐚𝐫𝐰𝐢𝐧 𝐎𝐟𝐟𝐢𝐜𝐚𝐥
      </h1>

      <p class="tagline">
        Your Premium Destination 🎰
      </p>

    </div>

    <!-- Divider -->
    <div class="divider"></div>

    <!-- Telegram Button -->
    <div class="buttons">

      <a
        href="https://t.me/+qI2onufHZ6AyMTQ1"
        class="btn btn-secondary"
        id="joinBtn"
        target="_blank"
        rel="noopener noreferrer"
      >
        JOIN NOW
      </a>

    </div>

    <!-- Timer -->
    <div class="timer-card">

      <div class="timer-label">
        Time Left For Free Join
      </div>

      <div class="timer-display" id="timer">
        00:20
      </div>

      <div class="timer-note">
        Offer starts counting down as soon as you open the page.
      </div>

    </div>

    <!-- Stats -->
    <div class="stats">

      <div class="stat">
        <div class="stat-number">12k+</div>
        <div class="stat-label">MEMBERS</div>
      </div>

      <div class="stat">
        <div class="stat-number">24/7</div>
        <div class="stat-label">UPDATES</div>
      </div>

      <div class="stat">
        <div class="stat-number">LIVE</div>
        <div class="stat-label">ACTIVE</div>
      </div>

    </div>

    <!-- Footer -->
    <div class="footer">
      © 2026 <span>Yaarwin Offical</span> • All Rights Reserved
    </div>

  </main>

  <script>

    /* Stars */
    const starsContainer =
      document.getElementById("stars");

    for (let i = 0; i < 45; i++) {

      const star =
        document.createElement("span");

      star.className = "star";

      star.style.left =
        Math.random() * 100 + "%";

      star.style.top =
        Math.random() * 100 + "%";

      star.style.animationDelay =
        Math.random() * 3 + "s";

      star.style.opacity =
        Math.random() * .6 + .1;

      starsContainer.appendChild(star);
    }


    /* 20 Second Countdown */
    let timeLeft = 20;

    const timer =
      document.getElementById("timer");

    const countdown =
      setInterval(() => {

        timeLeft--;

        if (timeLeft < 0) {
          timeLeft = 0;
          clearInterval(countdown);
        }

        timer.textContent =
          "00:" +
          String(timeLeft).padStart(2, "0");

      }, 1000);


    /* Telegram Click Tracking */
    document
      .getElementById("joinBtn")
      .addEventListener("click", function () {

        if (typeof fbq === "function") {

          fbq(
            "trackCustom",
            "TelegramClick"
          );

        }

      });

  </script>

</body>
</html>
