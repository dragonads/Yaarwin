<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Yaarwin Offical</title>
  <meta name="description" content="Yaarwin Offical">

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">

  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    html,
    body {
      width: 100%;
      min-height: 100%;
      font-family: "Inter", sans-serif;
      background: #111315;
      color: #fff;
      overflow-x: hidden;
    }

    body {
      min-height: 100vh;
      position: relative;
      background:
        radial-gradient(circle at 50% 35%, rgba(255,255,255,0.055), transparent 30%),
        linear-gradient(180deg, #141618 0%, #111315 100%);
    }

    /* Background glow */
    body::before {
      content: "";
      position: fixed;
      width: 330px;
      height: 330px;
      left: 50%;
      top: 35%;
      transform: translate(-50%, -50%);
      background: rgba(255,255,255,0.035);
      filter: blur(80px);
      border-radius: 50%;
      pointer-events: none;
    }

    /* Stars */
    .stars {
      position: fixed;
      inset: 0;
      overflow: hidden;
      pointer-events: none;
      z-index: 0;
    }

    .star {
      position: absolute;
      width: 3px;
      height: 3px;
      background: rgba(255,255,255,0.75);
      border-radius: 50%;
      animation: twinkle 2.5s infinite ease-in-out;
    }

    .star:nth-child(1)  { left: 8%;  top: 20%; animation-delay: .2s; }
    .star:nth-child(2)  { left: 19%; top: 42%; animation-delay: .8s; }
    .star:nth-child(3)  { left: 29%; top: 17%; animation-delay: 1.1s; }
    .star:nth-child(4)  { left: 43%; top: 12%; animation-delay: .4s; }
    .star:nth-child(5)  { left: 55%; top: 28%; animation-delay: 1.3s; }
    .star:nth-child(6)  { left: 67%; top: 15%; animation-delay: .7s; }
    .star:nth-child(7)  { left: 78%; top: 34%; animation-delay: 1.5s; }
    .star:nth-child(8)  { left: 91%; top: 22%; animation-delay: .3s; }
    .star:nth-child(9)  { left: 14%; top: 61%; animation-delay: 1.7s; }
    .star:nth-child(10) { left: 31%; top: 72%; animation-delay: .9s; }
    .star:nth-child(11) { left: 48%; top: 63%; animation-delay: 1.2s; }
    .star:nth-child(12) { left: 72%; top: 68%; animation-delay: .5s; }
    .star:nth-child(13) { left: 88%; top: 57%; animation-delay: 1.8s; }
    .star:nth-child(14) { left: 5%;  top: 82%; animation-delay: 1s; }
    .star:nth-child(15) { left: 58%; top: 88%; animation-delay: .6s; }
    .star:nth-child(16) { left: 96%; top: 79%; animation-delay: 1.4s; }

    @keyframes twinkle {
      0%, 100% {
        opacity: .25;
        transform: scale(.8);
      }
      50% {
        opacity: 1;
        transform: scale(1.3);
      }
    }

    .container {
      position: relative;
      z-index: 2;
      width: 100%;
      max-width: 520px;
      min-height: 100vh;
      margin: auto;
      padding: 84px 28px 35px;
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    /* LIVE NOW */
    .live-badge {
      display: flex;
      align-items: center;
      gap: 9px;
      padding: 9px 20px;
      border-radius: 30px;

      background: rgba(255,255,255,0.055);
      border: 1px solid rgba(255,255,255,0.10);

      box-shadow:
        inset 0 1px 0 rgba(255,255,255,0.04),
        0 5px 25px rgba(0,0,0,0.2);

      color: #d7d7d7;
      font-size: 15px;
      font-weight: 600;
      letter-spacing: 1px;
    }

    .live-dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: #18c989;
      box-shadow: 0 0 10px rgba(24,201,137,.8);
    }

    /* LOGO */
    .logo-wrap {
      width: 205px;
      height: 205px;
      margin-top: 30px;

      border-radius: 32px;
      overflow: hidden;

      background: #181818;
      border: 3px solid rgba(255,255,255,0.18);

      box-shadow:
        0 0 0 3px rgba(255,255,255,0.035),
        0 10px 40px rgba(0,0,0,.45);

      animation: logoFloat 4s ease-in-out infinite;
    }

    .logo-wrap img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
    }

    @keyframes logoFloat {
      0%, 100% {
        transform: translateY(0);
      }
      50% {
        transform: translateY(-4px);
      }
    }

    /* TITLE */
    .title {
      margin-top: 20px;
      text-align: center;
      font-size: 31px;
      line-height: 1.15;
      font-weight: 800;
      letter-spacing: -1px;
      color: #f3f3f3;
      text-shadow: 0 2px 10px rgba(0,0,0,.35);
    }

    .subtitle {
      margin-top: 12px;
      text-align: center;
      color: #bdbdbd;
      font-size: 18px;
      font-weight: 500;
      letter-spacing: .2px;
    }

    /* SMALL LINE */
    .divider {
      width: 74px;
      height: 3px;
      margin: 48px 0 48px;

      border-radius: 10px;

      background: linear-gradient(
        90deg,
        transparent,
        rgba(255,255,255,.7),
        transparent
      );

      box-shadow: 0 0 12px rgba(255,255,255,.18);
    }

    /* JOIN BUTTON */
    .join-btn {
      width: 100%;
      height: 76px;

      display: flex;
      align-items: center;
      justify-content: center;

      border-radius: 20px;

      border: 1px solid rgba(255,255,255,.13);
      background: rgba(255,255,255,.025);

      color: #ededed;
      text-decoration: none;

      font-size: 21px;
      font-weight: 800;
      letter-spacing: 1px;

      box-shadow:
        inset 0 1px 0 rgba(255,255,255,.035),
        0 10px 35px rgba(0,0,0,.22);

      transition: .2s ease;
    }

    .join-btn:hover {
      background: rgba(255,255,255,.055);
      border-color: rgba(255,255,255,.22);
      transform: translateY(-1px);
    }

    .join-btn:active {
      transform: scale(.985);
    }

    /* COUNTDOWN */
    .countdown-card {
      width: 100%;
      margin-top: 24px;
      padding: 27px 20px 25px;

      text-align: center;

      border-radius: 25px;

      background: rgba(255,255,255,.025);
      border: 1px solid rgba(255,255,255,.085);

      box-shadow:
        inset 0 1px 0 rgba(255,255,255,.025),
        0 12px 35px rgba(0,0,0,.22);
    }

    .countdown-label {
      font-size: 15px;
      font-weight: 700;
      color: #9f9f9f;
      letter-spacing: 2px;
    }

    .timer {
      margin-top: 10px;

      font-size: 39px;
      line-height: 1;
      font-weight: 800;
      letter-spacing: 1px;

      color: #ededed;
    }

    .countdown-info {
      max-width: 380px;
      margin: 13px auto 0;

      color: #a7a7a7;
      font-size: 17px;
      line-height: 1.45;
    }

    /* STATS */
    .stats {
      width: 100%;
      margin-top: 55px;

      display: grid;
      grid-template-columns: repeat(3, 1fr);
    }

    .stat {
      position: relative;
      text-align: center;
    }

    .stat:not(:last-child)::after {
      content: "";
      position: absolute;
      right: 0;
      top: 4px;
      height: 55px;
      width: 1px;
      background: rgba(255,255,255,.08);
    }

    .stat-number {
      font-size: 23px;
      font-weight: 800;
      color: #dedede;
    }

    .stat-label {
      margin-top: 8px;
      color: #858585;
      font-size: 14px;
      font-weight: 500;
      letter-spacing: 1px;
    }

    /* FOOTER */
    .footer {
      margin-top: auto;
      padding-top: 55px;

      text-align: center;
      color: #777;
      font-size: 13px;
    }

    /* MOBILE */
    @media (max-width: 480px) {

      .container {
        padding: 84px 28px 28px;
      }

      .logo-wrap {
        width: 205px;
        height: 205px;
      }

      .title {
        font-size: 30px;
      }

      .subtitle {
        font-size: 17px;
      }

      .divider {
        margin-top: 48px;
        margin-bottom: 48px;
      }

      .join-btn {
        height: 76px;
      }
    }

    @media (max-width: 360px) {

      .container {
        padding-left: 20px;
        padding-right: 20px;
      }

      .logo-wrap {
        width: 185px;
        height: 185px;
      }

      .title {
        font-size: 27px;
      }

      .timer {
        font-size: 35px;
      }
    }
  </style>
</head>

<body>

  <!-- Background Stars -->
  <div class="stars">
    <span class="star"></span>
    <span class="star"></span>
    <span class="star"></span>
    <span class="star"></span>
    <span class="star"></span>
    <span class="star"></span>
    <span class="star"></span>
    <span class="star"></span>
    <span class="star"></span>
    <span class="star"></span>
    <span class="star"></span>
    <span class="star"></span>
    <span class="star"></span>
    <span class="star"></span>
    <span class="star"></span>
    <span class="star"></span>
  </div>

  <main class="container">

    <!-- LIVE -->
    <div class="live-badge">
      <span class="live-dot"></span>
      LIVE NOW
    </div>

    <!-- LOGO -->
    <div class="logo-wrap">
      <img src="logo.png" alt="Yaarwin Offical">
    </div>

    <!-- TITLE -->
    <h1 class="title">Yaarwin Offical</h1>

    <p class="subtitle">
      Your Premium Destination 🎰
    </p>

    <!-- Divider -->
    <div class="divider"></div>

    <!-- JOIN -->
    <a
      class="join-btn"
      href="https://t.me/+qI2onufHZ6AyMTQ1"
      target="_blank"
      rel="noopener noreferrer"
    >
      JOIN NOW
    </a>

    <!-- COUNTDOWN -->
    <section class="countdown-card">

      <div class="countdown-label">
        TIME LEFT FOR FREE JOIN
      </div>

      <div class="timer" id="timer">
        00:20
      </div>

      <div class="countdown-info">
        Offer starts counting down as soon as you open the page.
      </div>

    </section>

    <!-- STATS -->
    <div class="stats">

      <div class="stat">
        <div class="stat-number">12k+</div>
        <div class="stat-label">MEMBERS</div>
      </div>

      <div class="stat">
        <div class="stat-number">24/7</div>
        <div class="stat-label">UPDATES</div>
      </div>

      <div class="stat">
        <div class="stat-number">LIVE</div>
        <div class="stat-label">ACTIVE</div>
      </div>

    </div>

    <!-- FOOTER -->
    <footer class="footer">
      © 2026 Yaarwin Offical • All Rights Reserved
    </footer>

  </main>

  <script>
    let timeLeft = 20;
    const timer = document.getElementById("timer");

    function updateTimer() {
      const seconds = String(timeLeft).padStart(2, "0");
      timer.textContent = "00:" + seconds;

      if (timeLeft > 0) {
        timeLeft--;
      } else {
        clearInterval(countdown);
        timer.textContent = "00:00";
      }
    }

    updateTimer();

    const countdown = setInterval(updateTimer, 1000);
  </script>

</body>
  </html>
