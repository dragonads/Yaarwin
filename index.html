<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">

<title>Yaarwin Offical</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700;800&display=swap" rel="stylesheet">

<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

html,body{
    width:100%;
    min-height:100%;
}

body{
    background:#111214;
    color:#fff;
    font-family:"Poppins",sans-serif;
    overflow-x:hidden;
}

/* BACKGROUND */

.bg{
    position:fixed;
    inset:0;
    z-index:0;
    overflow:hidden;

    background:
        radial-gradient(
            circle at 50% 35%,
            rgba(255,255,255,.035),
            transparent 38%
        ),
        #111214;
}

/* STARS */

.star{
    position:absolute;
    width:3px;
    height:3px;
    border-radius:50%;
    background:rgba(255,255,255,.55);
    opacity:.7;
    animation:blink 3s infinite ease-in-out;
}

.star:nth-child(1){left:5%;top:20%;}
.star:nth-child(2){left:18%;top:42%;animation-delay:.7s;}
.star:nth-child(3){left:31%;top:15%;animation-delay:1.3s;}
.star:nth-child(4){left:46%;top:10%;animation-delay:.4s;}
.star:nth-child(5){left:62%;top:23%;animation-delay:1s;}
.star:nth-child(6){left:78%;top:17%;animation-delay:1.7s;}
.star:nth-child(7){left:94%;top:30%;animation-delay:.5s;}
.star:nth-child(8){left:9%;top:61%;animation-delay:1.2s;}
.star:nth-child(9){left:29%;top:70%;animation-delay:.3s;}
.star:nth-child(10){left:52%;top:64%;animation-delay:1.5s;}
.star:nth-child(11){left:74%;top:68%;animation-delay:.8s;}
.star:nth-child(12){left:92%;top:57%;animation-delay:1.8s;}
.star:nth-child(13){left:15%;top:81%;animation-delay:.6s;}
.star:nth-child(14){left:64%;top:85%;animation-delay:1.1s;}

@keyframes blink{
    0%,100%{opacity:.25}
    50%{opacity:.8}
}

/* MAIN */

.page{
    position:relative;
    z-index:2;

    width:100%;
    max-width:620px;
    min-height:100vh;

    margin:0 auto;

    padding-top:107px;
    padding-left:36px;
    padding-right:36px;
    padding-bottom:20px;

    display:flex;
    flex-direction:column;
    align-items:center;
}

/* LIVE NOW */

.live{
    height:47px;
    padding:0 24px;

    border:1px solid rgba(255,255,255,.13);
    border-radius:30px;

    background:rgba(255,255,255,.045);

    display:flex;
    align-items:center;
    justify-content:center;
    gap:9px;

    color:#d4d4d4;

    font-size:16px;
    font-weight:600;
    letter-spacing:1px;

    box-shadow:
        inset 0 1px rgba(255,255,255,.04),
        0 5px 20px rgba(0,0,0,.15);
}

.live-dot{
    width:9px;
    height:9px;

    border-radius:50%;

    background:#18c98b;

    box-shadow:
        0 0 9px rgba(24,201,139,.8);
}

/* LOGO */

.logo{
    width:260px;
    height:260px;

    margin-top:27px;

    padding:5px;

    border-radius:40px;

    background:#171819;

    border:2px solid rgba(255,255,255,.12);

    box-shadow:
        0 0 0 3px rgba(255,255,255,.035),
        0 8px 30px rgba(0,0,0,.4);

    overflow:hidden;

    flex-shrink:0;
}

.logo img{
    display:block;

    width:100%;
    height:100%;

    object-fit:cover;

    border-radius:34px;
}

/* TITLE */

.title{
    margin-top:24px;

    width:100%;

    text-align:center;

    font-size:37px;
    line-height:1.1;

    font-weight:800;

    letter-spacing:-1px;

    color:#f0f0f0;
}

.subtitle{
    margin-top:9px;

    width:100%;

    text-align:center;

    color:#bdbdbd;

    font-size:19px;
    line-height:1.3;

    font-weight:500;
}

/* DIVIDER */

.divider{
    width:100px;
    height:4px;

    margin-top:51px;

    border-radius:10px;

    background:linear-gradient(
        90deg,
        transparent,
        rgba(255,255,255,.72),
        transparent
    );

    box-shadow:
        0 0 12px rgba(255,255,255,.12);
}

/* JOIN BUTTON */

.join{
    width:100%;
    height:96px;

    margin-top:67px;

    border-radius:29px;

    border:1px solid rgba(255,255,255,.14);

    background:rgba(255,255,255,.025);

    display:flex;
    align-items:center;
    justify-content:center;

    text-decoration:none;

    color:#f0f0f0;

    font-size:28px;
    font-weight:800;

    letter-spacing:.3px;

    box-shadow:
        inset 0 1px rgba(255,255,255,.025),
        0 10px 28px rgba(0,0,0,.18);

    flex-shrink:0;

    transition:.2s ease;
}

.join:active{
    transform:scale(.985);
}

/* COUNTDOWN */

.countdown{
    width:100%;

    margin-top:31px;

    padding:29px 18px 27px;

    border-radius:30px;

    border:1px solid rgba(255,255,255,.095);

    background:rgba(255,255,255,.025);

    text-align:center;

    box-shadow:
        inset 0 1px rgba(255,255,255,.025),
        0 10px 28px rgba(0,0,0,.18);

    flex-shrink:0;
}

.count-title{
    color:#a9a9a9;

    font-size:18px;
    line-height:1.2;

    font-weight:700;

    letter-spacing:2px;
}

.timer{
    margin-top:10px;

    color:#f2f2f2;

    font-size:47px;
    line-height:1;

    font-weight:800;

    letter-spacing:1px;
}

.count-text{
    margin-top:15px;

    color:#b4b4b4;

    font-size:17px;
    line-height:1.45;

    font-weight:400;
}

/* STATS */

.stats{
    width:100%;

    margin-top:65px;

    display:grid;
    grid-template-columns:repeat(3,1fr);

    flex-shrink:0;
}

.stat{
    position:relative;
    text-align:center;
}

.stat:not(:last-child)::after{
    content:"";

    position:absolute;

    right:0;
    top:1px;

    width:1px;
    height:53px;

    background:rgba(255,255,255,.09);
}

.number{
    color:#dcdcdc;

    font-size:24px;
    line-height:1.1;

    font-weight:800;
}

.label{
    margin-top:7px;

    color:#858585;

    font-size:14px;
    line-height:1.2;

    font-weight:500;

    letter-spacing:1px;
}

/* FOOTER */

.footer{
    margin-top:69px;

    padding-bottom:4px;

    text-align:center;

    color:#777;

    font-size:13px;

    white-space:nowrap;
}

/* ================================================= */
/* SAME PROPORTION FOR NORMAL MOBILE WIDTHS          */
/* ================================================= */

@media(max-width:430px){

    .page{
        padding-left:36px;
        padding-right:36px;
    }

    .logo{
        width:260px;
        height:260px;
    }

    .title{
        font-size:37px;
    }

    .join{
        height:96px;
    }
}

/* SMALLER WIDTH ONLY - DON'T ENLARGE ANYTHING */

@media(max-width:370px){

    .page{
        padding-left:25px;
        padding-right:25px;
    }

    .logo{
        width:235px;
        height:235px;
    }

    .title{
        font-size:32px;
    }

    .subtitle{
        font-size:17px;
    }

    .divider{
        margin-top:43px;
    }

    .join{
        height:82px;
        margin-top:55px;
        font-size:24px;
    }

    .countdown{
        margin-top:25px;
    }

    .count-title{
        font-size:15px;
    }

    .timer{
        font-size:42px;
    }

    .count-text{
        font-size:15px;
    }

    .stats{
        margin-top:48px;
    }

    .number{
        font-size:21px;
    }

    .label{
        font-size:12px;
    }

    .footer{
        margin-top:50px;
        font-size:12px;
    }
}
</style>
</head>

<body>

<!-- BACKGROUND -->
<div class="bg">

    <span class="star"></span>
    <span class="star"></span>
    <span class="star"></span>
    <span class="star"></span>
    <span class="star"></span>
    <span class="star"></span>
    <span class="star"></span>
    <span class="star"></span>
    <span class="star"></span>
    <span class="star"></span>
    <span class="star"></span>
    <span class="star"></span>
    <span class="star"></span>
    <span class="star"></span>

</div>


<!-- PAGE -->

<main class="page">

    <!-- LIVE -->

    <div class="live">

        <span class="live-dot"></span>

        LIVE NOW

    </div>


    <!-- LOGO -->

    <div class="logo">

        <img
            src="images.jpeg"
            alt="Yaarwin Offical"
        >

    </div>


    <!-- NAME -->

    <h1 class="title">
        Yaarwin Offical
    </h1>


    <!-- SUBTITLE -->

    <div class="subtitle">
        Your Premium Destination 🎰
    </div>


    <!-- DIVIDER -->

    <div class="divider"></div>


    <!-- JOIN -->

    <a
        class="join"
        href="https://t.me/+qI2onufHZ6AyMTQ1"
        target="_blank"
        rel="noopener noreferrer"
    >
        JOIN NOW
    </a>


    <!-- COUNTDOWN -->

    <div class="countdown">

        <div class="count-title">
            TIME LEFT FOR FREE JOIN
        </div>

        <div
            class="timer"
            id="timer"
        >
            00:20
        </div>

        <div class="count-text">
            Offer starts counting down as soon as you open the page.
        </div>

    </div>


    <!-- STATS -->

    <div class="stats">

        <div class="stat">

            <div class="number">
                12k+
            </div>

            <div class="label">
                MEMBERS
            </div>

        </div>


        <div class="stat">

            <div class="number">
                24/7
            </div>

            <div class="label">
                UPDATES
            </div>

        </div>


        <div class="stat">

            <div class="number">
                LIVE
            </div>

            <div class="label">
                ACTIVE
            </div>

        </div>

    </div>


    <!-- FOOTER -->

    <div class="footer">
        © 2026 Yaarwin Offical • All Rights Reserved
    </div>

</main>


<script>

let timeLeft = 20;

const timer =
    document.getElementById("timer");

const interval =
    setInterval(function(){

        timeLeft--;

        if(timeLeft < 0){

            clearInterval(interval);

            timer.textContent = "00:00";

            return;
        }

        timer.textContent =
            "00:" +
            String(timeLeft).padStart(2,"0");

    },1000);

</script>

</body>
  </html>
