<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">

  <title>Yaarwin Offical</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700;800&display=swap" rel="stylesheet">

  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    html,
    body {
      width: 100%;
      min-height: 100%;
    }

    body {
      background: #111214;
      color: #fff;
      font-family: "Poppins", sans-serif;
      overflow-x: hidden;
    }

    /* BACKGROUND */

    .background {
      position: fixed;
      inset: 0;
      overflow: hidden;
      pointer-events: none;
      z-index: 0;

      background:
        radial-gradient(
          circle at 50% 38%,
          rgba(255,255,255,.035),
          transparent 34%
        ),
        linear-gradient(
          180deg,
          #151619 0%,
          #101113 100%
        );
    }

    /* STARS */

    .star {
      position: absolute;
      width: 3px;
      height: 3px;
      border-radius: 50%;
      background: rgba(255,255,255,.52);
      animation: blink 3s infinite ease-in-out;
    }

    .s1  { left: 5%;  top: 25%; }
    .s2  { left: 17%; top: 43%; animation-delay: .7s; }
    .s3  { left: 28%; top: 16%; animation-delay: 1.3s; }
    .s4  { left: 43%; top: 12%; animation-delay: .4s; }
    .s5  { left: 58%; top: 20%; animation-delay: 1.7s; }
    .s6  { left: 75%; top: 15%; animation-delay: .9s; }
    .s7  { left: 91%; top: 30%; animation-delay: 1.5s; }
    .s8  { left: 9%;  top: 61%; animation-delay: .2s; }
    .s9  { left: 30%; top: 67%; animation-delay: 1.1s; }
    .s10 { left: 51%; top: 63%; animation-delay: .5s; }
    .s11 { left: 73%; top: 71%; animation-delay: 1.8s; }
    .s12 { left: 94%; top: 58%; animation-delay: .8s; }
    .s13 { left: 15%; top: 80%; animation-delay: 1.4s; }
    .s14 { left: 65%; top: 84%; animation-delay: .3s; }

    @keyframes blink {
      0%,100% {
        opacity: .18;
      }
      50% {
        opacity: .75;
      }
    }

    /* MAIN */

    .page {
      position: relative;
      z-index: 1;

      width: 100%;
      max-width: 620px;

      min-height: 100vh;

      margin: 0 auto;

      padding: 105px 36px 22px;

      display: flex;
      flex-direction: column;
      align-items: center;
    }

    /* LIVE */

    .live {
      height: 47px;

      padding: 0 24px;

      display: flex;
      align-items: center;
      gap: 9px;

      border-radius: 30px;

      background: rgba(255,255,255,.045);
      border: 1px solid rgba(255,255,255,.13);

      color: #d4d4d4;

      font-size: 16px;
      font-weight: 600;
      letter-spacing: 1px;

      box-shadow:
        inset 0 1px rgba(255,255,255,.035),
        0 5px 18px rgba(0,0,0,.16);
    }

    .dot {
      width: 9px;
      height: 9px;

      border-radius: 50%;

      background: #18c98b;

      box-shadow: 0 0 9px rgba(24,201,139,.8);
    }

    /* LOGO */

    .logo {
      width: 258px;
      height: 258px;

      margin-top: 27px;

      padding: 5px;

      border-radius: 39px;

      background: #171819;

      border: 2px solid rgba(255,255,255,.12);

      box-shadow:
        0 0 0 3px rgba(255,255,255,.035),
        0 9px 30px rgba(0,0,0,.42);

      overflow: hidden;
    }

    .logo img {
      width: 100%;
      height: 100%;

      display: block;

      object-fit: cover;

      border-radius: 33px;
    }

    /* NAME */

    .name {
      margin-top: 22px;

      font-size: 37px;
      line-height: 1.1;

      font-weight: 800;

      letter-spacing: -1.1px;

      text-align: center;

      color: #f0f0f0;
    }

    .subtitle {
      margin-top: 8px;

      font-size: 19px;

      line-height: 1.3;

      font-weight: 500;

      color: #bcbcbc;

      text-align: center;
    }

    /* DIVIDER */

    .divider {
      width: 100px;
      height: 4px;

      margin-top: 51px;

      border-radius: 10px;

      background: linear-gradient(
        90deg,
        transparent,
        rgba(255,255,255,.72),
        transparent
      );

      box-shadow: 0 0 12px rgba(255,255,255,.13);
    }

    /* JOIN */

    .join {
      width: 100%;
      height: 96px;

      margin-top: 67px;

      display: flex;
      align-items: center;
      justify-content: center;

      border-radius: 29px;

      border: 1px solid rgba(255,255,255,.14);

      background: rgba(255,255,255,.025);

      color: #f0f0f0;

      text-decoration: none;

      font-size: 28px;
      font-weight: 800;

      letter-spacing: .2px;

      box-shadow:
        inset 0 1px rgba(255,255,255,.025),
        0 10px 28px rgba(0,0,0,.18);

      transition: .2s ease;
    }

    .join:active {
      transform: scale(.985);
    }

    /* COUNTDOWN */

    .countdown {
      width: 100%;

      margin-top: 31px;

      padding: 29px 18px 27px;

      border-radius: 30px;

      background: rgba(255,255,255,.025);

      border: 1px solid rgba(255,255,255,.095);

      text-align: center;

      box-shadow:
        inset 0 1px rgba(255,255,255,.025),
        0 10px 28px rgba(0,0,0,.18);
    }

    .count-title {
      color: #a9a9a9;

      font-size: 18px;

      font-weight: 700;

      letter-spacing: 2px;
    }

    .timer {
      margin-top: 9px;

      color: #f2f2f2;

      font-size: 47px;

      line-height: 1;

      font-weight: 800;
    }

    .count-text {
      margin-top: 15px;

      color: #b4b4b4;

      font-size: 17px;

      line-height: 1.45;
    }

    /* STATS */

    .stats {
      width: 100%;

      margin-top: 65px;

      display: grid;
      grid-template-columns: repeat(3, 1fr);
    }

    .stat {
      position: relative;
      text-align: center;
    }

    .stat:not(:last-child)::after {
      content: "";

      position: absolute;

      right: 0;
      top: 2px;

      width: 1px;
      height: 53px;

      background: rgba(255,255,255,.09);
    }

    .number {
      color: #dcdcdc;

      font-size: 24px;

      line-height: 1.1;

      font-weight: 800;
    }

    .label {
      margin-top: 7px;

      color: #858585;

      font-size: 14px;

      font-weight: 500;

      letter-spacing: 1px;
    }

    /* FOOTER */

    footer {
      margin-top: 69px;

      color: #777;

      font-size: 13px;

      text-align: center;
    }

    /* MOBILE */

    @media (max-width: 600px) {

      .page {
        padding-top: 105px;
        padding-left: 36px;
        padding-right: 36px;
      }

      .logo {
        width: 258px;
        height: 258px;
      }

      .name {
        font-size: 37px;
      }
    }

    /* SMALL PHONES */

    @media (max-width: 390px) {

      .page {
        padding-top: 85px;
        padding-left: 25px;
        padding-right: 25px;
      }

      .live {
        height: 43px;
        font-size: 15px;
      }

      .logo {
        width: 225px;
        height: 225px;

        margin-top: 23px;
      }

      .name {
        margin-top: 19px;
        font-size: 32px;
      }

      .subtitle {
        font-size: 17px;
      }

      .divider {
        margin-top: 43px;
      }

      .join {
        height: 82px;
        margin-top: 55px;
        font-size: 24px;
        border-radius: 25px;
      }

      .countdown {
        margin-top: 25px;
        padding: 25px 15px 23px;
      }

      .count-title {
        font-size: 15px;
        letter-spacing: 1.6px;
      }

      .timer {
        font-size: 42px;
      }

      .count-text {
        font-size: 15px;
      }

      .stats {
        margin-top: 48px;
      }

      .number {
        font-size: 21px;
      }

      .label {
        font-size: 12px;
      }

      footer {
        margin-top: 50px;
        font-size: 12px;
      }
    }

    /* VERY SMALL HEIGHT DEVICES */

    @media (max-height: 720px) and (max-width: 600px) {

      .page {
        padding-top: 55px;
      }

      .logo {
        width: 210px;
        height: 210px;
        margin-top: 20px;
      }

      .name {
        margin-top: 16px;
        font-size: 30px;
      }

      .subtitle {
        font-size: 16px;
      }

      .divider {
        margin-top: 32px;
      }

      .join {
        margin-top: 42px;
        height: 72px;
      }

      .countdown {
        margin-top: 20px;
        padding: 20px 14px;
      }

      .timer {
        font-size: 38px;
      }

      .stats {
        margin-top: 38px;
      }

      footer {
        margin-top: 38px;
      }
    }
  </style>
</head>

<body>

  <!-- BACKGROUND -->
  <div class="background">

    <span class="star s1"></span>
    <span class="star s2"></span>
    <span class="star s3"></span>
    <span class="star s4"></span>
    <span class="star s5"></span>
    <span class="star s6"></span>
    <span class="star s7"></span>
    <span class="star s8"></span>
    <span class="star s9"></span>
    <span class="star s10"></span>
    <span class="star s11"></span>
    <span class="star s12"></span>
    <span class="star s13"></span>
    <span class="star s14"></span>

  </div>


  <!-- PAGE -->
  <main class="page">

    <!-- LIVE NOW -->
    <div class="live">
      <span class="dot"></span>
      LIVE NOW
    </div>


    <!-- LOGO -->
    <div class="logo">
      <img
        src="images.jpeg"
        alt="Yaarwin Offical"
      >
    </div>


    <!-- NAME -->
    <h1 class="name">
      Yaarwin Offical
    </h1>


    <!-- SUBTITLE -->
    <div class="subtitle">
      Your Premium Destination 🎰
    </div>


    <!-- DIVIDER -->
    <div class="divider"></div>


    <!-- JOIN -->
    <a
      class="join"
      href="https://t.me/+qI2onufHZ6AyMTQ1"
      target="_blank"
      rel="noopener noreferrer"
    >
      JOIN NOW
    </a>


    <!-- COUNTDOWN -->
    <section class="countdown">

      <div class="count-title">
        TIME LEFT FOR FREE JOIN
      </div>

      <div
        class="timer"
        id="timer"
      >
        00:20
      </div>

      <div class="count-text">
        Offer starts counting down as soon as you open the page.
      </div>

    </section>


    <!-- STATS -->
    <section class="stats">

      <div class="stat">

        <div class="number">
          12k+
        </div>

        <div class="label">
          MEMBERS
        </div>

      </div>


      <div class="stat">

        <div class="number">
          24/7
        </div>

        <div class="label">
          UPDATES
        </div>

      </div>


      <div class="stat">

        <div class="number">
          LIVE
        </div>

        <div class="label">
          ACTIVE
        </div>

      </div>

    </section>


    <!-- FOOTER -->
    <footer>
      © 2026 Yaarwin Offical • All Rights Reserved
    </footer>

  </main>


  <!-- COUNTDOWN -->
  <script>

    let timeLeft = 20;

    const timer =
      document.getElementById("timer");

    function updateTimer() {

      timer.textContent =
        "00:" +
        String(timeLeft).padStart(2, "0");

      if (timeLeft > 0) {
        timeLeft--;
      } else {
        clearInterval(interval);
      }
    }

    updateTimer();

    const interval =
      setInterval(updateTimer, 1000);

  </script>

</body>
  </html>
