<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Yaarwin Offical</title>
  <meta name="description" content="Yaarwin Offical">

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700;800&display=swap" rel="stylesheet">

  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    html,
    body {
      width: 100%;
      min-height: 100%;
    }

    body {
      min-height: 100vh;
      overflow-x: hidden;

      font-family: "Poppins", sans-serif;
      color: #ffffff;

      background:
        radial-gradient(
          circle at 50% 35%,
          rgba(255,255,255,0.035),
          transparent 35%
        ),
        linear-gradient(
          180deg,
          #121316 0%,
          #111214 100%
        );
    }

    /* ================= BACKGROUND STARS ================= */

    .stars {
      position: fixed;
      inset: 0;

      overflow: hidden;
      pointer-events: none;

      z-index: 0;
    }

    .star {
      position: absolute;

      width: 3px;
      height: 3px;

      border-radius: 50%;

      background: rgba(255,255,255,0.55);

      animation: twinkle 3s ease-in-out infinite;
    }

    .star:nth-child(1) {
      left: 7%;
      top: 28%;
      animation-delay: .2s;
    }

    .star:nth-child(2) {
      left: 18%;
      top: 45%;
      animation-delay: 1s;
    }

    .star:nth-child(3) {
      left: 32%;
      top: 18%;
      animation-delay: 1.7s;
    }

    .star:nth-child(4) {
      left: 48%;
      top: 13%;
      animation-delay: .5s;
    }

    .star:nth-child(5) {
      left: 64%;
      top: 26%;
      animation-delay: 1.3s;
    }

    .star:nth-child(6) {
      left: 81%;
      top: 16%;
      animation-delay: .8s;
    }

    .star:nth-child(7) {
      left: 94%;
      top: 39%;
      animation-delay: 1.8s;
    }

    .star:nth-child(8) {
      left: 11%;
      top: 61%;
      animation-delay: .4s;
    }

    .star:nth-child(9) {
      left: 28%;
      top: 70%;
      animation-delay: 1.4s;
    }

    .star:nth-child(10) {
      left: 52%;
      top: 63%;
      animation-delay: .9s;
    }

    .star:nth-child(11) {
      left: 73%;
      top: 68%;
      animation-delay: 1.6s;
    }

    .star:nth-child(12) {
      left: 91%;
      top: 57%;
      animation-delay: .7s;
    }

    .star:nth-child(13) {
      left: 6%;
      top: 81%;
      animation-delay: 1.2s;
    }

    .star:nth-child(14) {
      left: 60%;
      top: 86%;
      animation-delay: .3s;
    }

    @keyframes twinkle {

      0%,
      100% {
        opacity: .18;
        transform: scale(.8);
      }

      50% {
        opacity: .8;
        transform: scale(1.25);
      }
    }

    /* ================= MAIN ================= */

    .page {
      position: relative;
      z-index: 2;

      width: 100%;
      max-width: 620px;

      min-height: 100vh;

      margin: 0 auto;

      padding:
        107px
        36px
        27px;

      display: flex;
      flex-direction: column;
      align-items: center;
    }

    /* ================= LIVE NOW ================= */

    .live {
      height: 47px;

      padding: 0 25px;

      display: flex;
      align-items: center;
      justify-content: center;

      gap: 9px;

      border-radius: 30px;

      background: rgba(255,255,255,0.045);

      border: 1px solid rgba(255,255,255,0.14);

      box-shadow:
        inset 0 1px 0 rgba(255,255,255,0.04),
        0 5px 20px rgba(0,0,0,0.15);

      color: #d5d5d5;

      font-size: 16px;
      font-weight: 600;

      letter-spacing: 1px;
    }

    .live-dot {
      width: 9px;
      height: 9px;

      border-radius: 50%;

      background: #18c98b;

      box-shadow:
        0 0 8px rgba(24,201,139,0.8);
    }

    /* ================= LOGO ================= */

    .logo-box {
      width: 260px;
      height: 260px;

      margin-top: 27px;

      padding: 5px;

      border-radius: 40px;

      background: #171819;

      border: 2px solid rgba(255,255,255,0.12);

      box-shadow:
        0 0 0 3px rgba(255,255,255,0.035),
        0 10px 35px rgba(0,0,0,0.45);

      overflow: hidden;
    }

    .logo-box img {
      width: 100%;
      height: 100%;

      display: block;

      object-fit: cover;

      border-radius: 34px;
    }

    /* ================= TITLE ================= */

    .title {
      margin-top: 25px;

      text-align: center;

      font-size: 38px;
      line-height: 1.15;

      font-weight: 800;

      letter-spacing: -1.3px;

      color: #f1f1f1;
    }

    .subtitle {
      margin-top: 9px;

      text-align: center;

      font-size: 19px;

      font-weight: 500;

      color: #bdbdbd;
    }

    /* ================= DIVIDER ================= */

    .divider {
      width: 100px;
      height: 4px;

      margin-top: 57px;

      border-radius: 10px;

      background:
        linear-gradient(
          90deg,
          transparent,
          rgba(255,255,255,0.75),
          transparent
        );

      box-shadow:
        0 0 12px rgba(255,255,255,0.12);
    }

    /* ================= JOIN BUTTON ================= */

    .join {
      width: 100%;
      height: 96px;

      margin-top: 68px;

      display: flex;
      align-items: center;
      justify-content: center;

      border-radius: 30px;

      border: 1px solid rgba(255,255,255,0.14);

      background: rgba(255,255,255,0.025);

      color: #f0f0f0;

      text-decoration: none;

      font-size: 28px;

      font-weight: 800;

      letter-spacing: 0.5px;

      box-shadow:
        inset 0 1px 0 rgba(255,255,255,0.025),
        0 12px 30px rgba(0,0,0,0.2);

      transition: 0.2s ease;
    }

    .join:hover {
      background: rgba(255,255,255,0.045);

      border-color: rgba(255,255,255,0.2);
    }

    .join:active {
      transform: scale(0.985);
    }

    /* ================= COUNTDOWN ================= */

    .countdown {
      width: 100%;

      margin-top: 31px;

      padding:
        30px
        20px
        27px;

      text-align: center;

      border-radius: 30px;

      background: rgba(255,255,255,0.025);

      border: 1px solid rgba(255,255,255,0.10);

      box-shadow:
        inset 0 1px 0 rgba(255,255,255,0.025),
        0 12px 35px rgba(0,0,0,0.2);
    }

    .countdown-title {
      font-size: 18px;

      font-weight: 700;

      color: #a9a9a9;

      letter-spacing: 2px;
    }

    .timer {
      margin-top: 10px;

      font-size: 47px;

      line-height: 1;

      font-weight: 800;

      letter-spacing: 1px;

      color: #f1f1f1;
    }

    .countdown-text {
      margin-top: 16px;

      font-size: 18px;

      line-height: 1.5;

      color: #b5b5b5;
    }

    /* ================= STATS ================= */

    .stats {
      width: 100%;

      margin-top: 70px;

      display: grid;

      grid-template-columns:
        repeat(3, 1fr);
    }

    .stat {
      position: relative;

      text-align: center;
    }

    .stat:not(:last-child)::after {
      content: "";

      position: absolute;

      right: 0;
      top: 2px;

      width: 1px;
      height: 57px;

      background: rgba(255,255,255,0.10);
    }

    .number {
      font-size: 25px;

      font-weight: 800;

      color: #dcdcdc;
    }

    .label {
      margin-top: 7px;

      font-size: 15px;

      font-weight: 500;

      color: #888;

      letter-spacing: 1px;
    }

    /* ================= FOOTER ================= */

    footer {
      margin-top: 75px;

      padding-bottom: 4px;

      text-align: center;

      color: #777;

      font-size: 14px;
    }

    /* ================= MOBILE ================= */

    @media (max-width: 600px) {

      .page {
        padding:
          107px
          36px
          27px;
      }

      .logo-box {
        width: 260px;
        height: 260px;
      }

      .title {
        font-size: 38px;
      }

      .subtitle {
        font-size: 19px;
      }

      .join {
        height: 96px;
        font-size: 28px;
      }

      .countdown {
        padding:
          30px
          20px
          27px;
      }

      .timer {
        font-size: 47px;
      }
    }

    @media (max-width: 400px) {

      .page {
        padding-left: 24px;
        padding-right: 24px;
      }

      .logo-box {
        width: 245px;
        height: 245px;
      }

      .title {
        font-size: 34px;
      }

      .subtitle {
        font-size: 18px;
      }

      .join {
        height: 91px;
        font-size: 26px;
      }

      .countdown-title {
        font-size: 16px;
      }

      .timer {
        font-size: 44px;
      }

      .countdown-text {
        font-size: 16px;
      }

      .stats {
        margin-top: 60px;
      }

      .number {
        font-size: 22px;
      }

      .label {
        font-size: 13px;
      }

      footer {
        margin-top: 65px;
      }
    }
  </style>
</head>

<body>

  <!-- BACKGROUND STARS -->
  <div class="stars">

    <span class="star"></span>
    <span class="star"></span>
    <span class="star"></span>
    <span class="star"></span>
    <span class="star"></span>
    <span class="star"></span>
    <span class="star"></span>
    <span class="star"></span>
    <span class="star"></span>
    <span class="star"></span>
    <span class="star"></span>
    <span class="star"></span>
    <span class="star"></span>
    <span class="star"></span>

  </div>


  <!-- MAIN PAGE -->

  <main class="page">

    <!-- LIVE NOW -->

    <div class="live">

      <span class="live-dot"></span>

      LIVE NOW

    </div>


    <!-- LOGO -->

    <div class="logo-box">

      <img
        src="images.jpeg"
        alt="Yaarwin Offical"
      >

    </div>


    <!-- TITLE -->

    <h1 class="title">
      Yaarwin Offical
    </h1>


    <!-- SUBTITLE -->

    <div class="subtitle">
      Your Premium Destination 🎰
    </div>


    <!-- DIVIDER -->

    <div class="divider"></div>


    <!-- JOIN BUTTON -->

    <a
      class="join"
      href="https://t.me/+qI2onufHZ6AyMTQ1"
      target="_blank"
      rel="noopener noreferrer"
    >
      JOIN NOW
    </a>


    <!-- COUNTDOWN -->

    <div class="countdown">

      <div class="countdown-title">
        TIME LEFT FOR FREE JOIN
      </div>

      <div
        class="timer"
        id="timer"
      >
        00:20
      </div>

      <div class="countdown-text">
        Offer starts counting down as soon as you open the page.
      </div>

    </div>


    <!-- STATS -->

    <div class="stats">

      <div class="stat">

        <div class="number">
          12k+
        </div>

        <div class="label">
          MEMBERS
        </div>

      </div>


      <div class="stat">

        <div class="number">
          24/7
        </div>

        <div class="label">
          UPDATES
        </div>

      </div>


      <div class="stat">

        <div class="number">
          LIVE
        </div>

        <div class="label">
          ACTIVE
        </div>

      </div>

    </div>


    <!-- FOOTER -->

    <footer>
      © 2026 Yaarwin Offical • All Rights Reserved
    </footer>

  </main>


  <!-- COUNTDOWN SCRIPT -->

  <script>

    let timeLeft = 20;

    const timer =
      document.getElementById("timer");

    function updateTimer() {

      timer.textContent =
        "00:" +
        String(timeLeft).padStart(2, "0");

      if (timeLeft > 0) {

        timeLeft--;

      } else {

        clearInterval(countdownInterval);

      }
    }

    updateTimer();

    const countdownInterval =
      setInterval(updateTimer, 1000);

  </script>

</body>
</html>
